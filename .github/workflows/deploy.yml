# 推送到 main 分支時，自動測試、建置並發布到 GitHub Pages（病友端網頁）。
# 首次使用：GitHub 專案 → Settings → Pages → Source 選「GitHub Actions」。
# 注意：GitHub Pages 只能放靜態網頁；醫護規範卡的受保護伺服器（staff-server/）不能放在這裡。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build（網址為 https://<帳號>.github.io/<專案名稱>/）
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # 醫護人員專區入口：在 GitHub 專案 Settings → Secrets and variables → Actions → Variables
          # 新增 STAFF_PORTAL_URL（院方核准、需院內帳號登入的 SharePoint／內網入口）。未設定時顯示「尚未開放」。
          VITE_STAFF_PORTAL_URL: ${{ vars.STAFF_PORTAL_URL }}
      - name: 確認發布檔案沒有院內連結
        run: npm run check:bundle
        env:
          VITE_STAFF_PORTAL_URL: ${{ vars.STAFF_PORTAL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
